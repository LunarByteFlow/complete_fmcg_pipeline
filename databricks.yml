bundle:
  name: fmcg_data_lakehouse

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-fbd23b57-d18b.cloud.databricks.com

resources:
  jobs:
    fmcg_orders_medallion_job:
      name: "FMCG Orders Medallion Pipeline Run"
      
      tasks:
        - task_key: run_orders_pipeline
          spark_python_task:
            python_file: "src/pipelines/run_orders_pipeline.py"
          environment_key: default

        - task_key: gold_fact_processing
          depends_on:
            - task_key: run_orders_pipeline
          spark_python_task:
            python_file: "src/pipelines/run_gold_pipeline.py"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "13.3.x-scala2.12"
            spark_version: "13.3.x-scala2.12"
